name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build (runs vet and tests first)
        shell: pwsh
        run: .\build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (Get-Content build\bin\Torrent.exe.sha256 -Raw).Split(' ')[0]
          $notes = @(
            "Portable single-file BitTorrent client for Windows 10/11 (x64). No installation, no telemetry.",
            "",
            "Requires the WebView2 Runtime, which is preinstalled on current Windows.",
            "",
            "SHA-256 of Torrent.exe:",
            "",
            "    $sha",
            "",
            "Verify before running:",
            "",
            "    (Get-FileHash .\Torrent.exe -Algorithm SHA256).Hash.ToLower()",
            "",
            "The binary is not code-signed yet, so Windows SmartScreen may warn on first run.",
            "Built by GitHub Actions from this tag with CGO_ENABLED=0 and -trimpath, so it can be reproduced.",
            "",
            "Privacy policy: PRIVACY.md | Security model: SECURITY.md"
          ) -join "`n"
          Set-Content -Path release-notes.txt -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --title "Torrent $env:GITHUB_REF_NAME" --notes-file release-notes.txt build\bin\Torrent.exe build\bin\Torrent.exe.sha256
