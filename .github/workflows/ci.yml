name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to a commit SHA, not a moving tag.
permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version 0.0.0-ci -SkipTests

      - name: Binary must not contain build-machine paths
        shell: pwsh
        run: |
          if (Select-String -Path build\bin\Torrent.exe -Pattern 'D:\a\' -SimpleMatch -Quiet) {
            throw "-trimpath did not strip build paths"
          }
          Write-Host "clean"
